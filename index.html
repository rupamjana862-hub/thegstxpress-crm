<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thegstxpress CRM by Rupam</title>
<style>
:root{
  --primary:#0f172a;
  --accent:#6366f1;
  --accent-gradient:linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
  --meta-gradient:linear-gradient(135deg, #1877f2 0%, #0052cc 100%);
  --bg:#090d16;
  --card-bg:#111827;
  --text:#f3f4f6;
  --text-muted:#9ca3af;
  --border:#1f2937;
  --hover:#1e293b;
}
body{font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;margin:0;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg, #090d16 0%, #1e1b4b 100%);color:#fff;padding:22px 30px;font-size:24px;font-weight:700;box-shadow:0 10px 25px rgba(0,0,0,0.5);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
header span{font-size:13px;background:rgba(99,102,241,0.2);color:#818cf8;border:1px solid rgba(99,102,241,0.4);padding:5px 12px;border-radius:20px;font-weight:600}
nav{padding:14px 30px;background:#0d1322;display:flex;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,0.3);overflow-x:auto;border-bottom:1px solid var(--border)}
button{padding:10px 18px;border:0;border-radius:10px;cursor:pointer;background:#162032;font-weight:600;color:var(--text-muted);transition:all 0.3s ease;white-space:nowrap}
button:hover{background:var(--hover);color:#fff}
button.active{background:var(--accent-gradient);color:#fff;box-shadow:0 4px 15px rgba(99,102,241,0.4)}
main{padding:25px;max-width:1450px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));gap:15px;margin-bottom:20px}
.card{background:var(--card-bg);padding:20px;border-radius:16px;box-shadow:0 8px 25px rgba(0,0,0,0.3);border:1px solid var(--border)}
.card b{display:block;font-size:26px;margin-top:6px;color:#fff}
.panel{background:var(--card-bg);padding:25px;border-radius:16px;margin-top:20px;box-shadow:0 8px 25px rgba(0,0,0,0.3);border:1px solid var(--border);overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:13px;font-weight:600;color:var(--text-muted)}
input,select,textarea{padding:11px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none;background:#090d16;color:var(--text)}
.checkbox-group{display:flex;flex-direction:column;gap:6px;max-height:140px;overflow-y:auto;border:1px solid var(--border);padding:10px;border-radius:10px;background:#090d16}
.checkbox-group label{font-weight:normal;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text-muted)}
table{width:100%;border-collapse:collapse;min-width:1150px}
th,td{padding:12px 14px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}
th{background:#162032;color:var(--text);font-weight:700}
.hide{display:none}
.primary{background:var(--accent-gradient);color:#fff;box-shadow:0 4px 15px rgba(99,102,241,0.4)}
.wa-btn{background:#059669;color:white;padding:5px 10px;border-radius:8px;text-decoration:none;font-size:12px;font-weight:600}
.call-btn{background:#2563eb;color:white;padding:5px 10px;border-radius:8px;text-decoration:none;font-size:12px;font-weight:600}
.stage-select{padding:6px 10px;border-radius:8px;border:1px solid var(--border);font-size:12px;font-weight:600;background:#090d16;color:var(--text)}
.badge{background:rgba(99,102,241,0.15);color:#818cf8;border:1px solid rgba(99,102,241,0.3);padding:4px 10px;border-radius:6px;font-weight:600}
.edit-btn{background:rgba(14,165,233,0.15);color:#38bdf8;padding:5px 10px;border-radius:6px;cursor:pointer;font-weight:600;font-size:12px}
.del-btn{background:rgba(239,68,68,0.15);color:#f87171;padding:5px 10px;border-radius:6px;cursor:pointer;font-weight:600;font-size:12px}
#authScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 9999; }
.auth-box { background: var(--card-bg); padding: 40px; border-radius: 20px; border: 1px solid var(--border); width: 100%; max-width: 380px; text-align: center; }
.auth-box input { width: 100%; box-sizing: border-box; text-align: center; font-size: 18px; letter-spacing: 3px; margin-bottom: 20px; }
.auth-box button { width: 100%; padding: 12px; font-size: 16px; }
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-box">
    <h2>THEGSTXPRESS CRM</h2>
    <p>Enter Master Password</p>
    <input type="password" id="passInput" placeholder="••••" onkeydown="if(event.key==='Enter') verifyPassword()">
    <button class="primary" onclick="verifyPassword()">Unlock CRM</button>
  </div>
</div>

<header>THEGSTXPRESS CRM <span>By Rupam</span></header>
<nav>
  <button class="active" onclick="tab('dash',this)">Dashboard</button>
  <button onclick="tab('leads',this)">Leads Management</button>
  <button onclick="tab('callerPortal',this)" style="background:linear-gradient(135deg, #059669 0%, #10b981 100%);color:white;">Caller Portal 📞</button>
</nav>
<main>

<section id="dash">
  <h2>Dashboard Overview</h2>
  <div class="cards" id="cards"></div>
  <div class="panel"><h3>Recent Leads</h3><div id="recent"></div></div>
</section>

<section id="leads" class="hide">
  <h2>Lead Management</h2>
  <div class="panel">
    <input type="hidden" id="editLeadId">
    <h3 id="formTitle">Add New Lead</h3>
    <div class="grid">
      <div class="field"><label>Name</label><input id="n"></div>
      <div class="field"><label>Phone</label><input id="ph"></div>
      <div class="field"><label>City</label><input id="city"></div>
      <div class="field"><label>Status</label><select id="st"><option>New</option><option>Contacted</option><option>Interested</option><option>Converted</option></select></div>
      <div class="field"><label>Amount (₹)</label><input id="amt" type="number"></div>
    </div>
    <br><button class="primary" id="saveLeadBtn" onclick="saveLeadAction()">Save Lead</button>
  </div>
  <div class="panel"><div id="lt"></div></div>
</section>

<section id="callerCallerPortal" class="hide">
  <h2>Caller Portal</h2>
  <div class="panel"><div id="callerLeadsTable"></div></div>
</section>

</main>

<script>
const MASTER_PASSWORD = "1234";
let L = JSON.parse(localStorage.getItem('tgx_leads')) || [
  {id: 'TGX-0001', name: 'Amit Kumar', phone: '9876543210', city: 'Kolkata', status: 'New', amount: 5000}
];

function verifyPassword() {
  if(document.getElementById('passInput').value === MASTER_PASSWORD) {
    document.getElementById('authScreen').style.display = 'none';
    sessionStorage.tgxAuth = "true";
  } else { alert('Wrong Password!'); }
}

window.onload = function() {
  if(sessionStorage.tgxAuth === "true") document.getElementById('authScreen').style.display = 'none';
  render();
};

function tab(id, b) {
  document.querySelectorAll('main>section').forEach(x => x.classList.add('hide'));
  document.getElementById(id).classList.remove('hide');
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  if(b) b.classList.add('active');
  render();
}

function save() {
  localStorage.setItem('tgx_leads', JSON.stringify(L));
  render();
}

function saveLeadAction() {
  let name = document.getElementById('n').value;
  let phone = document.getElementById('ph').value;
  if(!name || !phone) return alert('Name & Phone required!');
  
  L.unshift({
    id: 'TGX-' + String(L.length + 1).padStart(4, '0'),
    name: name,
    phone: phone,
    city: document.getElementById('city').value,
    status: document.getElementById('st').value,
    amount: +document.getElementById('amt').value || 0
  });
  save();
  document.getElementById('n').value = '';
  document.getElementById('ph').value = '';
  alert('Lead Saved Successfully!');
}

function render() {
  document.getElementById('cards').innerHTML = `<div class="card">Total Leads<b>${L.length}</b></div>`;
  document.getElementById('lt').innerHTML = '<table><tr><th>ID</th><th>Name</th><th>Phone</th><th>Status</th></tr>' +
    L.map(x => `<tr><td><b>${x.id}</b></td><td>${x.name}</td><td>${x.phone}</td><td>${x.status}</td></tr>`).join('') + '</table>';
  document.getElementById('recent').innerHTML = document.getElementById('lt').innerHTML;
}
</script>
</body>
</html>
