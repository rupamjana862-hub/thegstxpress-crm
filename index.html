<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thegstxpress CRM by Rupam</title>
<style>
:root{
  --primary:#0f172a;
  --accent:#6366f1;
  --accent-gradient:linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
  --bg:#090d16;
  --card-bg:#111827;
  --text:#f3f4f6;
  --text-muted:#9ca3af;
  --border:#1f2937;
}
body{font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;margin:0;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg, #090d16 0%, #1e1b4b 100%);color:#fff;padding:22px 30px;font-size:24px;font-weight:700;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
header span{font-size:13px;background:rgba(99,102,241,0.2);color:#818cf8;border:1px solid rgba(99,102,241,0.4);padding:5px 12px;border-radius:20px}
nav{padding:14px 30px;background:#0d1322;display:flex;gap:10px;border-bottom:1px solid var(--border)}
button{padding:10px 18px;border:0;border-radius:10px;cursor:pointer;background:#162032;font-weight:600;color:var(--text-muted);transition:all 0.3s}
button:hover{background:#1e293b;color:#fff}
button.active{background:var(--accent-gradient);color:#fff}
main{padding:25px;max-width:1400px;margin:auto}
.panel{background:var(--card-bg);padding:25px;border-radius:16px;margin-top:20px;border:1px solid var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:13px;font-weight:600;color:var(--text-muted)}
input,select{padding:11px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:#090d16;color:var(--text);outline:none}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:12px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}
th{background:#162032;color:#fff}
.primary{background:var(--accent-gradient);color:#fff}
.hide{display:none}
#authScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 9999; }
.auth-box { background: var(--card-bg); padding: 40px; border-radius: 20px; border: 1px solid var(--border); width: 100%; max-width: 380px; text-align: center; }
.auth-box input { width: 100%; box-sizing: border-box; text-align: center; font-size: 18px; letter-spacing: 3px; margin-bottom: 20px; }
.auth-box button { width: 100%; padding: 12px; font-size: 16px; }
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-box">
    <h2>THEGSTXPRESS CRM</h2>
    <p>Enter Master Password</p>
    <input type="password" id="passInput" placeholder="••••" onkeydown="if(event.key==='Enter') verifyPassword()">
    <button class="primary" onclick="verifyPassword()">Unlock CRM</button>
  </div>
</div>

<header>THEGSTXPRESS CRM <span>By Rupam</span></header>
<nav>
  <button class="active" onclick="tab('dash',this)">Dashboard</button>
  <button onclick="tab('leads',this)">Leads Management</button>
</nav>
<main>

<section id="dash">
  <h2>Dashboard Overview</h2>
  <div class="panel">
    <h3>Total Leads: <span id="totalCount">0</span></h3>
  </div>
  <div class="panel">
    <h3>Recent Leads</h3>
    <div id="recentTable"></div>
  </div>
</section>

<section id="leads" class="hide">
  <h2>Add & Manage Leads</h2>
  <div class="panel">
    <div class="grid">
      <div class="field"><label>Client Name</label><input id="leadName"></div>
      <div class="field"><label>Phone Number</label><input id="leadPhone"></div>
      <div class="field"><label>City</label><input id="leadCity"></div>
      <div class="field"><label>Status</label><select id="leadStatus"><option>New</option><option>Contacted</option><option>Interested</option><option>Converted</option></select></div>
      <div class="field"><label>Amount (₹)</label><input id="leadAmount" type="number"></div>
    </div>
    <br>
    <button class="primary" onclick="addNewLead()">Save Lead</button>
  </div>
  <div class="panel">
    <h3>All Leads List</h3>
    <div id="fullTable"></div>
  </div>
</section>

</main>

<script>
const MASTER_PASSWORD = "1234";
let leadsData = JSON.parse(localStorage.getItem('tgx_simple_leads')) || [
  {id: 'TGX-001', name: 'Amit Kumar', phone: '9876543210', city: 'Kolkata', status: 'New', amount: 5000}
];

function verifyPassword() {
  let val = document.getElementById('passInput').value;
  if(val === MASTER_PASSWORD) {
    document.getElementById('authScreen').style.display = 'none';
    sessionStorage.setItem('tgxAuth', 'true');
  } else {
    alert('Incorrect Password! Try "1234".');
  }
}

window.onload = function() {
  if(sessionStorage.getItem('tgxAuth') === 'true') {
    document.getElementById('authScreen').style.display = 'none';
  }
  renderAll();
};

function tab(sectionId, btn) {
  document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hide'));
  document.getElementById(sectionId).classList.remove('hide');
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderAll();
}

function saveAndRefresh() {
  localStorage.setItem('tgx_simple_leads', JSON.stringify(leadsData));
  renderAll();
}

function addNewLead() {
  let name = document.getElementById('leadName').value.trim();
  let phone = document.getElementById('leadPhone').value.trim();
  let city = document.getElementById('leadCity').value.trim();
  let status = document.getElementById('leadStatus').value;
  let amount = Number(document.getElementById('leadAmount').value) || 0;

  if(!name || !phone) {
    alert('Please enter Client Name and Phone Number!');
    return;
  }

  let newId = 'TGX-' + String(leadsData.length + 1).padStart(3, '0');
  leadsData.unshift({ id: newId, name, phone, city, status, amount });

  document.getElementById('leadName').value = '';
  document.getElementById('leadPhone').value = '';
  document.getElementById('leadCity').value = '';
  document.getElementById('leadAmount').value = '';

  saveAndRefresh();
  alert('Lead saved successfully!');
}

function deleteLead(id) {
  if(confirm('Are you sure you want to delete this lead?')) {
    leadsData = leadsData.filter(l => l.id !== id);
    saveAndRefresh();
  }
}

function renderAll() {
  document.getElementById('totalCount').innerText = leadsData.length;

  let tableHTML = '<table><tr><th>ID</th><th>Name</th><th>Phone</th><th>City</th><th>Status</th><th>Amount</th><th>Action</th></tr>' +
    (leadsData.length ? leadsData.map(l => `
      <tr>
        <td><b>${l.id}</b></td>
        <td>${l.name}</td>
        <td>${l.phone}</td>
        <td>${l.city || '-'}</td>
        <td>${l.status}</td>
        <td>₹${l.amount.toLocaleString('en-IN')}</td>
        <td><button onclick="deleteLead('${l.id}')" style="background:rgba(239,68,68,0.2);color:#f87171;padding:5px 10px;border-radius:6px;border:0;cursor:pointer;">Delete</button></td>
      </tr>
    `).join('') : '<tr><td colspan="7">No leads found.</td></tr>') + '</table>';

  document.getElementById('fullTable').innerHTML = tableHTML;
  document.getElementById('recentTable').innerHTML = tableHTML;
}

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAZKGifYNaPrKXb-wMg_vNvpLi3BoDueVQ",
  authDomain: "thegstxpresscrm.firebaseapp.com",
  projectId: "thegstxpresscrm",
  storageBucket: "thegstxpresscrm.firebasestorage.app",
  messagingSenderId: "1049995780326",
  appId: "1:1049995780326:web:f53ec6a94b839c2424db27",
  measurementId: "G-8Y77LVVRFD"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
</script>
</body>
</html>
